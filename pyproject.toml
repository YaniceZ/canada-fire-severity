[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canada-fire-severity"
version = "0.1.0"
description = "Burn severity, pre-fire forest decline, LiDAR canopy loss and AlphaEarth embeddings for Canadian wildfires, from open data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Yanice Zeng" }]
dependencies = [
    "numpy>=1.26",
    "geopandas>=0.14",
    "rasterio>=1.3",
    "pystac-client>=0.8",
    "matplotlib>=3.8",
    "scikit-learn>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
firesev = "firesev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 125
target-version = "py310"
extend-exclude = ["data", "out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
